services:
  supportboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/xxanderwp/supportboard:latest
    container_name: supportboard
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./.storage:/app/.storage
      - ./.ai_chat_history:/app/.ai_chat_history
      - ./.ai_history:/app/.ai_history
      - ./.knowledge:/app/.knowledge
      - /app/.knowledge/example